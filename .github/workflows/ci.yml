name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: desk
          POSTGRES_PASSWORD: desk
          POSTGRES_DB: desk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U desk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # SQLite in memory for the unit tests; the relay locking tests need real Postgres (SKIP LOCKED).
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://desk:desk@localhost:5432/desk_test
      # The keyword stub scores badly on purpose; this only proves the eval harness runs without a key.
      - run: python -m evals.run stub
        env:
          TRIAGE_PROVIDER: stub

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
