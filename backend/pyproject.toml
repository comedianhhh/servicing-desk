[project]
name = "servicing-desk"
version = "0.1.0"
description = "Borrower correspondence desk for mortgage servicing ops: Reg X §1024.35/.36 case workflow with clocks, outbox, and LLM-proposed triage."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "anthropic>=0.69",
    "holidays>=0.57",
    "google-genai>=1.0",
    "confluent-kafka>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
desk-api = "servicing_desk.api.main:run"
desk-worker = "servicing_desk.workers.cli:main"
desk-seed = "servicing_desk.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["servicing_desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008", "UP042"]  # long lines in tests/tables; FastAPI Depends(); StrEnum not needed
