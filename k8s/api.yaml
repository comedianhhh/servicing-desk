apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2   # stateless; the optimistic lock on cases is what makes two replicas safe
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: servicing-desk
          imagePullPolicy: IfNotPresent
          command: ["desk-api"]
          envFrom:
            - configMapRef: { name: desk-config }
            - secretRef: { name: desk-keys, optional: true }
          ports: [{ containerPort: 8000, name: http }]
          # Liveness must not depend on Postgres: a DB outage should not get the API pods restarted.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          # Readiness does depend on it: no DB, no traffic.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: documents, mountPath: /app/documents }
      volumes:
        - name: documents
          persistentVolumeClaim: { claimName: documents }
